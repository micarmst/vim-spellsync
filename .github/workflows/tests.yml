name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.editor }} ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        editor: [vim, nvim]
        version: [stable]
        include:
          - os: ubuntu-latest
            editor: vim
            version: v8.2.1926
          - os: ubuntu-latest
            editor: nvim
            version: v0.5.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: rhysd/action-setup-vim@v1
        id: editor
        with:
          neovim: ${{ matrix.editor == 'nvim' }}
          version: ${{ matrix.version }}
      - name: Run regression tests
        run: python tests/test_spellsync.py --editor "${{ steps.editor.outputs.executable }}" -v
